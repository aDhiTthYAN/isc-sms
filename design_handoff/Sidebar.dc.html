<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:230,&quot;height&quot;:820},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  TINTS = {
    dashboard:'var(--brand)', students:'var(--blue)', followups:'var(--teal)', batches:'var(--indigo)',
    assessments:'var(--violet)', concerns:'var(--orange)', leaderboard:'var(--amber)',
    tasks:'var(--green)', reports:'var(--pink)', leads:'var(--green)', documents:'var(--slate)',
    staff:'var(--slate)', requests:'var(--blue)', trash:'var(--red)', settings:'var(--slate)',
  };

  renderVals(){
    const active = this.props.active || '';
    const nav = {};
    for(const k of Object.keys(this.TINTS)){
      const on = k===active;
      nav[k] = {
        bg: on ? 'var(--brand-50)' : 'transparent',
        color: on ? 'var(--brand-ink)' : 'var(--text-sub)',
        weight: on ? 600 : 500,
        ic: on ? 'var(--brand)' : this.TINTS[k],
      };
    }
    return { nav };
  }
}
</script>

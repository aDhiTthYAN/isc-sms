<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/isc-design-system-44b9e318-905b-4330-a4ea-d1d6b542217b/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/isc-design-system-44b9e318-905b-4330-a4ea-d1d6b542217b/tokens/colors.css">
  <link rel="stylesheet" href="_ds/isc-design-system-44b9e318-905b-4330-a4ea-d1d6b542217b/tokens/typography.css">
  <link rel="stylesheet" href="_ds/isc-design-system-44b9e318-905b-4330-a4ea-d1d6b542217b/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/isc-design-system-44b9e318-905b-4330-a4ea-d1d6b542217b/base.css">
  <link rel="stylesheet" href="_ds/isc-design-system-44b9e318-905b-4330-a4ea-d1d6b542217b/styles.css">
  <link rel="stylesheet" href="theme.css">
  <style>
    html,body{background:var(--canvas);}
    .litem{ transition: box-shadow .15s var(--ease); }
    .litem:hover{ box-shadow: var(--shadow-md); }
    ::-webkit-scrollbar{ width:9px; height:9px; }
  </style>
</helmet>

<div style="display:flex; height:100vh; overflow:hidden; background:var(--canvas); font-family:var(--font-body); color:var(--text);">

  <dc-import name="Sidebar" active="requests" hint-size="230px,100%"></dc-import>

  <div style="flex:1; display:flex; flex-direction:column; min-width:0; height:100vh;">

    <header style="background:var(--surface); border-bottom:1px solid var(--border); padding:0 26px; height:56px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-shrink:0;">
      <div style="display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-muted);">
        <span>Management</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        <span style="color:var(--text); font-weight:600;">Staff Requests</span>
      </div>
      <div style="display:flex; align-items:center; gap:9px;">
        <div style="width:32px; height:32px; border-radius:50%; background:var(--grad-brand); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:12px; color:#fff;">AD</div>
        <div>
          <div style="font-size:13px; font-weight:600; line-height:1.2;">Adithyan R</div>
          <div style="font-size:11px; color:var(--text-muted);">CEO</div>
        </div>
      </div>
    </header>

    <main style="flex:1; overflow-y:auto; padding:24px 26px 32px;">

      <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px;">
        <div>
          <div style="display:flex; align-items:center; gap:10px;">
            <h2 style="font-size:24px; font-weight:700;">Staff Requests</h2>
            <span class="badge badge-amber"><span class="dot"></span>{{ pendingCount }} pending</span>
          </div>
          <div style="font-size:13px; color:var(--text-muted); margin-top:3px;">Review and approve requests raised by your team.</div>
        </div>
        <div style="display:inline-flex; background:var(--surface-sunken); border-radius:10px; padding:3px; gap:2px;">
          <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
            <button onClick="{{ t.onClick }}" style="display:flex; align-items:center; gap:6px; padding:7px 14px; border:none; border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer; background:{{ t.bg }}; color:{{ t.color }}; box-shadow:{{ t.shadow }};">{{ t.label }}<span style="font-size:11px; opacity:.7;">{{ t.count }}</span></button>
          </sc-for>
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:12px; max-width:860px;">
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
          <div class="litem" style="background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow-sm); padding:16px 20px;">
            <div style="display:flex; align-items:flex-start; gap:14px;">
              <div style="width:40px; height:40px; border-radius:11px; background:{{ r.typeBg }}; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                <span style="display:flex; color:{{ r.typeInk }};">{{ r.icon }}</span>
              </div>
              <div style="flex:1; min-width:0;">
                <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                  <span style="font-size:14px; font-weight:600;">{{ r.title }}</span>
                  <span class="chip" style="font-size:10.5px;">{{ r.typeLabel }}</span>
                </div>
                <div style="font-size:12.5px; color:var(--text-muted); margin-top:4px;">From <b style="color:var(--text); font-weight:600;">{{ r.from }}</b> &nbsp;·&nbsp; {{ r.date }}</div>
                <div style="font-size:12.5px; color:var(--text-sub); margin-top:8px; background:var(--surface-sunken); border-radius:9px; padding:9px 12px;">{{ r.reason }}</div>
              </div>
              <div style="flex-shrink:0;">
                <sc-if value="{{ r.pending }}" hint-placeholder-val="{{ true }}">
                  <div style="display:flex; gap:8px;">
                    <button onClick="{{ r.onReject }}" class="btn btn-danger btn-sm">Reject</button>
                    <button onClick="{{ r.onAccept }}" class="btn btn-primary btn-sm">Approve</button>
                  </div>
                </sc-if>
                <sc-if value="{{ r.resolved }}" hint-placeholder-val="{{ false }}">
                  <span class="badge {{ r.statusCls }}"><span class="dot"></span>{{ r.statusLabel }}</span>
                </sc-if>
              </div>
            </div>
          </div>
        </sc-for>
        <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
          <div style="padding:48px 20px; text-align:center; color:var(--text-muted); font-size:13.5px; background:var(--surface); border:1px solid var(--border); border-radius:14px;">No requests in this view.</div>
        </sc-if>
      </div>

    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1320,&quot;height&quot;:850}}">
class Component extends DCLogic {
  TYPES = {
    removal:    { label:'Removal',    bg:'var(--red-soft)',    ink:'var(--red-ink)' },
    leave:      { label:'Leave',      bg:'var(--blue-soft)',   ink:'var(--blue-ink)' },
    assessment: { label:'Assessment', bg:'var(--violet-soft)', ink:'var(--violet-ink)' },
    access:     { label:'Access',     bg:'var(--amber-soft)',  ink:'var(--amber-ink)' },
  };

  REQUESTS = [
    { id:'r1', type:'leave',      title:'Leave request · Jun 24–26', from:'Rahul Verma', date:'2h ago', reason:'Family function out of town. Will hand over B-14 sessions to Vikram.', status:'pending' },
    { id:'r2', type:'assessment',title:'Approve new IELTS mock assessment', from:'Aisha Khan', date:'5h ago', reason:'Need approval to add a full-length IELTS mock for Batch B-14 before finals.', status:'pending' },
    { id:'r3', type:'removal',   title:'Remove staff from B-10', from:'Sneha Patel', date:'Yesterday', reason:'Batch B-10 is completed — requesting removal from the staff list to free capacity.', status:'pending' },
    { id:'r4', type:'access',    title:'Access to Lead Pipeline', from:'Arjun Mehta', date:'Jun 18', reason:'Need access to follow up on inbound leads assigned to me.', status:'accepted' },
    { id:'r5', type:'leave',     title:'Leave request · Jun 12', from:'Vikram Nair', date:'Jun 16', reason:'Medical appointment, half day.', status:'rejected' },
  ];

  state = { filter:'pending', overrides:{} };

  seg(active){ return { bg:active?'var(--surface)':'transparent', color:active?'var(--text)':'var(--text-muted)', shadow:active?'var(--shadow-xs)':'none' }; }

  icon(type){
    const p = {
      removal:'M3 6h18 M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6',
      leave:'M8 2v4 M16 2v4 M3 10h18 M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z',
      assessment:'M9 11l3 3L22 4 M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11',
      access:'M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z',
    }[type] || '';
    const paths = p.split(' M').map((d,i)=> React.createElement('path',{key:i,d:(i?'M':'')+d}));
    const extra = type==='access' ? [React.createElement('circle',{key:'c',cx:12,cy:12,r:3})] : [];
    return React.createElement('svg',{width:18,height:18,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'}, ...paths, ...extra);
  }

  setStatus(id, status){ this.setState(s => ({ overrides:{ ...s.overrides, [id]:status } })); }

  renderVals(){
    const f = this.state.filter;
    const all = this.REQUESTS.map(r => ({ ...r, status: this.state.overrides[r.id] || r.status }));
    const counts = {
      pending: all.filter(r=>r.status==='pending').length,
      accepted: all.filter(r=>r.status==='accepted').length,
      rejected: all.filter(r=>r.status==='rejected').length,
    };

    const rows = all.filter(r => r.status===f).map(r => {
      const t = this.TYPES[r.type];
      return {
        ...r,
        typeLabel:t.label, typeBg:t.bg, typeInk:t.ink, icon:this.icon(r.type),
        pending: r.status==='pending', resolved: r.status!=='pending',
        statusLabel: r.status==='accepted' ? 'Approved' : 'Rejected',
        statusCls: r.status==='accepted' ? 'badge-green' : 'badge-red',
        onAccept: () => this.setStatus(r.id,'accepted'),
        onReject: () => this.setStatus(r.id,'rejected'),
      };
    });

    const mk = (key,label) => { const s=this.seg(f===key); return { label, count:counts[key], bg:s.bg, color:s.color, shadow:s.shadow, onClick:()=>this.setState({filter:key}) }; };

    return {
      rows, isEmpty: rows.length===0, pendingCount: counts.pending,
      tabs: [ mk('pending','Pending'), mk('accepted','Approved'), mk('rejected','Rejected') ],
    };
  }
}
</script>
</body>
</html>

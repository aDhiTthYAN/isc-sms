<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/isc-design-system-44b9e318-905b-4330-a4ea-d1d6b542217b/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/isc-design-system-44b9e318-905b-4330-a4ea-d1d6b542217b/tokens/colors.css">
  <link rel="stylesheet" href="_ds/isc-design-system-44b9e318-905b-4330-a4ea-d1d6b542217b/tokens/typography.css">
  <link rel="stylesheet" href="_ds/isc-design-system-44b9e318-905b-4330-a4ea-d1d6b542217b/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/isc-design-system-44b9e318-905b-4330-a4ea-d1d6b542217b/base.css">
  <link rel="stylesheet" href="_ds/isc-design-system-44b9e318-905b-4330-a4ea-d1d6b542217b/styles.css">
  <link rel="stylesheet" href="theme.css">
  <style>
    html,body{background:var(--canvas);}
    .srow:hover{ background: var(--surface-hover); }
    ::-webkit-scrollbar{ width:9px; height:9px; }
  </style>
</helmet>

<div style="display:flex; height:100vh; overflow:hidden; background:var(--canvas); font-family:var(--font-body); color:var(--text);">

  <dc-import name="Sidebar" active="trash" hint-size="230px,100%"></dc-import>

  <div style="flex:1; display:flex; flex-direction:column; min-width:0; height:100vh;">

    <header style="background:var(--surface); border-bottom:1px solid var(--border); padding:0 26px; height:56px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-shrink:0;">
      <div style="display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-muted);">
        <span>Management</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        <span style="color:var(--text); font-weight:600;">Trash</span>
      </div>
      <div style="display:flex; align-items:center; gap:9px;">
        <div style="width:32px; height:32px; border-radius:50%; background:var(--grad-brand); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:12px; color:#fff;">AD</div>
        <div>
          <div style="font-size:13px; font-weight:600; line-height:1.2;">Adithyan R</div>
          <div style="font-size:11px; color:var(--text-muted);">CEO</div>
        </div>
      </div>
    </header>

    <main style="flex:1; overflow-y:auto; padding:24px 26px 32px;">

      <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:16px;">
        <div>
          <h2 style="font-size:24px; font-weight:700;">Trash</h2>
          <div style="font-size:13px; color:var(--text-muted); margin-top:3px;">Deleted items are kept for 30 days, then removed permanently.</div>
        </div>
        <button class="btn btn-danger btn-sm" style="height:38px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          Empty Trash
        </button>
      </div>

      <div style="display:flex; align-items:center; gap:10px; background:var(--amber-soft); border-radius:10px; padding:11px 16px; margin-bottom:18px; max-width:760px;">
        <span style="display:flex; color:var(--amber-ink); flex-shrink:0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></span>
        <span style="font-size:12.5px; color:var(--amber-ink);">Restoring a batch also restores all of its students and their progress.</span>
      </div>

      <div class="table-container">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Item</th>
                <th style="width:120px;">Type</th>
                <th style="width:160px;">Deleted by</th>
                <th style="width:140px;">Deleted</th>
                <th style="width:230px;"></th>
              </tr>
            </thead>
            <tbody>
              <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
                <tr class="srow">
                  <td>
                    <div style="display:flex; align-items:center; gap:11px;">
                      <div style="width:34px; height:34px; border-radius:10px; background:{{ r.tileBg }}; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                        <span style="display:flex; color:{{ r.tileInk }};">{{ r.icon }}</span>
                      </div>
                      <div style="font-size:13.5px; font-weight:600;">{{ r.name }}</div>
                    </div>
                  </td>
                  <td><span class="chip" style="font-size:11px;">{{ r.typeLabel }}</span></td>
                  <td style="font-size:12.5px; color:var(--text-sub);">{{ r.by }}</td>
                  <td style="font-size:12.5px; color:var(--text-muted);">{{ r.when }}</td>
                  <td>
                    <div style="display:flex; gap:8px; justify-content:flex-end;">
                      <button onClick="{{ r.onRestore }}" class="btn btn-secondary btn-sm">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
                        Restore
                      </button>
                      <button onClick="{{ r.onDelete }}" class="btn btn-danger btn-sm">Delete</button>
                    </div>
                  </td>
                </tr>
              </sc-for>
            </tbody>
          </table>
        </div>
        <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
          <div style="padding:56px 20px; text-align:center; color:var(--text-muted); font-size:13.5px;">Trash is empty.</div>
        </sc-if>
      </div>

    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1320,&quot;height&quot;:850}}">
class Component extends DCLogic {
  TYPES = {
    student: { label:'Student', bg:'var(--blue-soft)',   ink:'var(--blue-ink)' },
    batch:   { label:'Batch',   bg:'var(--indigo-soft)', ink:'var(--indigo-ink)' },
    task:    { label:'Task',    bg:'var(--green-soft)',  ink:'var(--green-ink)' },
    document:{ label:'Document',bg:'var(--slate-soft)',  ink:'var(--slate-ink)' },
  };

  ITEMS = [
    { id:'d1', type:'student',  name:'Sahil Gupta',            by:'Aisha Khan',   when:'2 days ago' },
    { id:'d2', type:'batch',    name:'B-08 · Spoken Hindi',    by:'Adithyan R',   when:'4 days ago' },
    { id:'d3', type:'task',     name:'Verify May attendance',  by:'Priya Sharma', when:'5 days ago' },
    { id:'d4', type:'document', name:'IELTS_band_chart.pdf',   by:'Rahul Verma',  when:'1 week ago' },
    { id:'d5', type:'student',  name:'Megha Joseph',           by:'Sneha Patel',  when:'2 weeks ago' },
    { id:'d6', type:'task',     name:'Old onboarding checklist',by:'Vikram Nair', when:'3 weeks ago' },
  ];

  state = { removed:{} };

  icon(type){
    const map = {
      student:[['circle',{cx:12,cy:8,r:5}],['path',{d:'M20 21a8 8 0 0 0-16 0'}]],
      batch:[['path',{d:'M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z'}],['path',{d:'M22 10v6'}],['path',{d:'M6 12.5V16a6 3 0 0 0 12 0v-3.5'}]],
      task:[['path',{d:'m9 11 3 3L22 4'}],['path',{d:'M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11'}]],
      document:[['path',{d:'M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z'}],['path',{d:'M14 2v4a2 2 0 0 0 2 2h4'}]],
    };
    const els = (map[type]||[]).map(([t,p],i)=>React.createElement(t,{key:i,...p}));
    return React.createElement('svg',{width:17,height:17,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'}, ...els);
  }

  renderVals(){
    const rows = this.ITEMS.filter(i => !this.state.removed[i.id]).map(i => {
      const t = this.TYPES[i.type];
      return {
        ...i, typeLabel:t.label, tileBg:t.bg, tileInk:t.ink, icon:this.icon(i.type),
        onRestore: () => this.setState(s => ({ removed:{ ...s.removed, [i.id]:true } })),
        onDelete:  () => this.setState(s => ({ removed:{ ...s.removed, [i.id]:true } })),
      };
    });
    return { rows, isEmpty: rows.length===0 };
  }
}
</script>
</body>
</html>
